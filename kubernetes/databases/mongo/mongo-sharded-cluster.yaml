apiVersion: v1
kind: Service
metadata:
  name: mongo-cfg
  namespace: restaurante
spec:
  clusterIP: None
  selector:
    app: mongo-cfg
  ports:
    - name: mongo
      port: 27019
      targetPort: 27019
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-cfg
  namespace: restaurante
spec:
  serviceName: mongo-cfg
  replicas: 3
  selector:
    matchLabels:
      app: mongo-cfg
  template:
    metadata:
      labels:
        app: mongo-cfg
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongod
          image: mongo:7.0
          ports:
            - containerPort: 27019
          command:
            - mongod
            - --configsvr
            - --replSet
            - cfgReplSet
            - --port
            - "27019"
            - --bind_ip_all
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-shard1
  namespace: restaurante
spec:
  clusterIP: None
  selector:
    app: mongo-shard1
  ports:
    - name: mongo
      port: 27018
      targetPort: 27018
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-shard1
  namespace: restaurante
spec:
  serviceName: mongo-shard1
  replicas: 3
  selector:
    matchLabels:
      app: mongo-shard1
  template:
    metadata:
      labels:
        app: mongo-shard1
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongod
          image: mongo:7.0
          ports:
            - containerPort: 27018
          command:
            - mongod
            - --shardsvr
            - --replSet
            - shard1ReplSet
            - --port
            - "27018"
            - --bind_ip_all
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongos
  namespace: restaurante
spec:
  selector:
    app: mongos
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongos
  namespace: restaurante
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongos
  template:
    metadata:
      labels:
        app: mongos
    spec:
      containers:
        - name: mongos
          image: mongo:7.0
          ports:
            - containerPort: 27017
          command:
            - mongos
            - --configdb
            - cfgReplSet/mongo-cfg-0.mongo-cfg:27019,mongo-cfg-1.mongo-cfg:27019,mongo-cfg-2.mongo-cfg:27019
            - --bind_ip_all
            - --port
            - "27017"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-scripts
  namespace: restaurante
data:
  init-mongo.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "==> Esperando mongod config servers..."
    for i in {1..240}; do
      if mongosh --quiet --host mongo-cfg-0.mongo-cfg --port 27019 --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; then
        break
      fi
      sleep 2
    done

    echo "==> Iniciando cfgReplSet (si aplica)..."
    mongosh --quiet --host mongo-cfg-0.mongo-cfg --port 27019 <<'JS'
    try {
      rs.status();
      print("cfgReplSet ya estaba iniciado");
    } catch (e) {
      rs.initiate({
        _id: "cfgReplSet",
        configsvr: true,
        members: [
          { _id: 0, host: "mongo-cfg-0.mongo-cfg:27019" },
          { _id: 1, host: "mongo-cfg-1.mongo-cfg:27019" },
          { _id: 2, host: "mongo-cfg-2.mongo-cfg:27019" }
        ]
      });
      print("cfgReplSet iniciado");
    }
    JS

    echo "==> Esperando PRIMARY en cfgReplSet..."
    mongosh --quiet --host mongo-cfg-0.mongo-cfg --port 27019 --eval '
      const start = Date.now();
      while (Date.now() - start < 300000) {
        try {
          const s = rs.status();
          if ((s.members || []).some(m => m.stateStr === "PRIMARY")) { quit(0); }
        } catch (e) {}
        sleep(1000);
      }
      quit(1);
    '

    echo "==> Esperando mongod shard1..."
    for i in {1..240}; do
      if mongosh --quiet --host mongo-shard1-0.mongo-shard1 --port 27018 --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; then
        break
      fi
      sleep 2
    done

    echo "==> Iniciando shard1ReplSet (si aplica)..."
    mongosh --quiet --host mongo-shard1-0.mongo-shard1 --port 27018 <<'JS'
    try {
      rs.status();
      print("shard1ReplSet ya estaba iniciado");
    } catch (e) {
      rs.initiate({
        _id: "shard1ReplSet",
        members: [
          { _id: 0, host: "mongo-shard1-0.mongo-shard1:27018" },
          { _id: 1, host: "mongo-shard1-1.mongo-shard1:27018" },
          { _id: 2, host: "mongo-shard1-2.mongo-shard1:27018" }
        ]
      });
      print("shard1ReplSet iniciado");
    }
    JS

    echo "==> Esperando PRIMARY en shard1ReplSet..."
    mongosh --quiet --host mongo-shard1-0.mongo-shard1 --port 27018 --eval '
      const start = Date.now();
      while (Date.now() - start < 300000) {
        try {
          const s = rs.status();
          if ((s.members || []).some(m => m.stateStr === "PRIMARY")) { quit(0); }
        } catch (e) {}
        sleep(1000);
      }
      quit(1);
    '

    echo "==> Esperando mongos..."
    for i in {1..240}; do
      if mongosh --quiet --host mongos --port 27017 --eval "db.runCommand({ping:1}).ok" >/dev/null 2>&1; then
        break
      fi
      sleep 2
    done

    echo "==> Agregando shard (si aplica)..."
    mongosh --quiet --host mongos --port 27017 <<'JS'
    const shardConn = "shard1ReplSet/mongo-shard1-0.mongo-shard1:27018,mongo-shard1-1.mongo-shard1:27018,mongo-shard1-2.mongo-shard1:27018";
    const shards = sh.status().shards || [];
    const exists = shards.some(s => (s.host || "").includes("shard1ReplSet/"));
    if (!exists) {
      const res = sh.addShard(shardConn);
      printjson(res);
    } else {
      print("Shard ya estaba agregado");
    }
    JS

    echo "==> [1/3] Configurando esquema de MongoDB..."
    mongosh --quiet --host mongos --port 27017 <<'JS'
    db = db.getSiblingDB("restaurant_mongo_db");

    [
      "roles",
      "users",
      "restaurants",
      "menus",
      "tables",
      "orders",
      "order_items",
      "reservations",
      "counters"
    ].forEach((collectionName) => {
      if (!db.getCollectionNames().includes(collectionName)) {
        db.createCollection(collectionName);
      }
    });

    db.roles.createIndex({ role_id: 1 }, { unique: true });
    db.roles.createIndex({ role_name: 1 }, { unique: true });

    db.users.createIndex({ user_id: 1 }, { unique: true });
    db.users.createIndex({ user_name: 1 }, { unique: true });
    db.users.createIndex({ keycloak_id: 1 }, { unique: true, sparse: true });

    db.restaurants.createIndex({ restaurant_id: 1 }, { unique: true });
    db.restaurants.createIndex({ restaurant_name: 1 });
    db.restaurants.createIndex({ admin_id: 1 });

    db.menus.createIndex({ menu_id: 1 });
    db.menus.createIndex({ restaurant_id: 1, dish_name: 1 }, { unique: true });
    db.menus.createIndex({ category: 1 });

    db.tables.createIndex({ table_id: 1 }, { unique: true });
    db.tables.createIndex({ restaurant_id: 1, table_number: 1 }, { unique: true });

    db.orders.createIndex({ order_id: 1 }, { unique: true });
    db.orders.createIndex({ client_id: 1 });
    db.orders.createIndex({ restaurant_id: 1 });
    db.orders.createIndex({ table_id: 1 });

    db.order_items.createIndex({ order_item_id: 1 }, { unique: true });
    db.order_items.createIndex({ order_id: 1 });
    db.order_items.createIndex({ menu_id: 1 });

    db.reservations.createIndex({ reservation_id: 1 }, { unique: true });
    db.reservations.createIndex({ client_id: 1 });
    db.reservations.createIndex({ table_id: 1 });
    db.reservations.createIndex({ reservation_date: 1 });

    db.roles.updateOne(
      { role_id: 1 },
      { $setOnInsert: { role_id: 1, role_name: "admin" } },
      { upsert: true }
    );
    db.roles.updateOne(
      { role_id: 2 },
      { $setOnInsert: { role_id: 2, role_name: "client" } },
      { upsert: true }
    );

    [
      ["roles", 2],
      ["users", 0],
      ["restaurants", 0],
      ["menus", 0],
      ["tables", 0],
      ["orders", 0],
      ["order_items", 0],
      ["reservations", 0]
    ].forEach(([name, seq]) => {
      db.counters.updateOne(
        { _id: name },
        { $setOnInsert: { seq: seq } },
        { upsert: true }
      );
    });

    print("Schema e índices creados");
    JS

    echo "==> Mongo shardeado listo."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-cluster-init
  namespace: restaurante
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0
          command: ["bash", "/scripts/init-mongo.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: mongo-init-scripts
            defaultMode: 0775
