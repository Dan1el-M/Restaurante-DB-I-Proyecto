apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: restaurante
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: restaurante-api:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["backend.app.api_main:app", "--host", "0.0.0.0", "--port", "80", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - containerPort: 80
          env:
            - name: SERVICE_NAME
              value: "api"
            - name: ROOT_PATH
              value: "/api"
          envFrom:
            - configMapRef:
                name: restaurante-config
            - secretRef:
                name: restaurante-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
