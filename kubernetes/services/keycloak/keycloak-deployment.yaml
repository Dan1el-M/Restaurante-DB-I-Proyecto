#Despliega Keycloak (servidor de autenticación/autorización)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: restaurante
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: restaurante-secret
                  key: KEYCLOAK_ADMIN_USER
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restaurante-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/restaurant-realm.json
              subPath: restaurant-realm.json
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
