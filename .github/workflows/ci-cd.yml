name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: pytest -q backend/tests/unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    needs: unit-tests
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for CI
        run: |
          cat > .env <<EOF
          DATABASE_ENGINE=postgres
          SERVICE_MODE=all

          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres123
          POSTGRES_DB=restaurant_postgres_db
          POSTGRES_URL=postgresql+psycopg2://postgres:postgres123@postgres:5432/restaurant_postgres_db

          MONGO_USER=mongo
          MONGO_PASSWORD=mongo123
          MONGO_DB=restaurant_mongo_db
          MONGO_URL=mongodb://mongos:27017/restaurant_mongo_db

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_URL=redis://redis:6379/0

          ELASTICSEARCH_HOST=elasticsearch
          ELASTICSEARCH_PORT=9200
          ELASTICSEARCH_URL=http://elasticsearch:9200

          KEYCLOAK_ADMIN_USER=admin
          KEYCLOAK_ADMIN_PASSWORD=admin
          KEYCLOAK_PORT=8001
          KEYCLOAK_URL=http://keycloak:8080
          KEYCLOAK_REALM=restaurant-realm
          KEYCLOAK_CLIENT_ID=restaurant-client
          KEYCLOAK_CLIENT_SECRET=

          API_PORT=8000
          API_HOST=0.0.0.0
          NGINX_PORT=8080
          EOF

      - name: Start integration stack
        run: docker compose up -d api_direct

      - name: Run integration tests
        run: |
          docker compose run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e DATABASE_ENGINE=postgres \
            -e SERVICE_MODE=all \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres123 \
            -e POSTGRES_DB=restaurant_postgres_db \
            -e POSTGRES_URL=postgresql+psycopg2://postgres:postgres123@postgres:5432/restaurant_postgres_db \
            -e MONGO_USER=mongo \
            -e MONGO_PASSWORD=mongo123 \
            -e MONGO_DB=restaurant_mongo_db \
            -e MONGO_URL=mongodb://mongos:27017/restaurant_mongo_db \
            -e REDIS_HOST=redis \
            -e REDIS_PORT=6379 \
            -e REDIS_URL=redis://redis:6379/0 \
            -e ELASTICSEARCH_HOST=elasticsearch \
            -e ELASTICSEARCH_PORT=9200 \
            -e ELASTICSEARCH_URL=http://elasticsearch:9200 \
            -e KEYCLOAK_URL=http://keycloak:8080 \
            -e KEYCLOAK_REALM=restaurant-realm \
            -e KEYCLOAK_CLIENT_ID=restaurant-client \
            -e KEYCLOAK_CLIENT_SECRET= \
            api pytest -q backend/tests/integration
      - name: Stop integration stack
        if: always()
        run: docker compose down -v

  docker-build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    needs: integration-tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        if: ${{ !env.ACT }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Set local metadata (act)
        id: meta-local
        if: ${{ env.ACT }}
        run: |
          echo "tags=local-api:act" >> "$GITHUB_OUTPUT"
          echo "labels=" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags || steps.meta-local.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || steps.meta-local.outputs.labels }}

