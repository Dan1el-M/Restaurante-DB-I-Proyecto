services:
  postgres:
    image: postgres:15.6
    container_name: restaurant-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dbs:/docker-entrypoint-initdb.d
    networks:
      - restaurant-network

  mongo:
    image: mongo:7.0
    container_name: restaurant-mongo
    ports:
      - "27017:27017"
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./dbs/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - restaurant-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm 
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
      #este es el json que se descarga de keycloak para tener persistencia de los datos
    volumes:
      - ./backend/app/restaurant-realm.json:/opt/keycloak/data/import/restaurant-realm.json
    networks:
      - restaurant-network

  api:
    build: ./backend
    container_name: restaurant-api
    ports:
      - "${API_PORT}:80"
    env_file:
      - .env
    depends_on:
      - postgres
      - mongo
    networks:
      - restaurant-network

  seed:
    build: ./backend
    container_name: restaurant-seed
    command: python backend/app/scripts/seed_admin.py
    env_file:
      - .env
    depends_on:
      - postgres
      - mongo
      - keycloak
    networks:
      - restaurant-network
    restart: "no"

# Volumenes para persistir datos
volumes:
  postgres_data:
  mongo_data:

# Define el tipo de red que usa la red, en este caso todos se pueden ver entre si
networks:
  restaurant-network:
    driver: bridge 
