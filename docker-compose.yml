x-app-env: &app-env
  DATABASE_ENGINE: ${DATABASE_ENGINE:-mongo}
  SERVICE_MODE: ${SERVICE_MODE:-all}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
  POSTGRES_DB: ${POSTGRES_DB:-restaurant_postgres_db}
  POSTGRES_URL: ${POSTGRES_URL:-postgresql+psycopg2://postgres:postgres123@postgres:5432/restaurant_postgres_db}
  MONGO_USER: ${MONGO_USER:-mongo}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-mongo123}
  MONGO_DB: ${MONGO_DB:-restaurant_mongo_db}
  MONGO_URL: ${MONGO_URL:-mongodb://mongos:27017/restaurant_mongo_db}
  API_HOST: ${API_HOST:-0.0.0.0}
  KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-restaurant-realm}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-restaurant-client}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
  KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
  KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
  KEYCLOAK_TOKEN_AUDIENCE: ${KEYCLOAK_TOKEN_AUDIENCE:-restaurant-client}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-60}
  SEARCH_PORT: ${SEARCH_PORT:-8002}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}

x-airflow-common: &airflow-common
  build:
    context: ./dataW/airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.10.5-python3.11}
  image: restaurant-airflow:${AIRFLOW_VERSION:-2.10.5-python3.11}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-restaurant_airflow_local_secret_change_me}
    AIRFLOW__WEBSERVER__WORKERS: ${AIRFLOW_WEBSERVER_WORKERS:-1}
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: ${AIRFLOW_WEBSERVER_MASTER_TIMEOUT:-900}
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: ${AIRFLOW_WEBSERVER_WORKER_TIMEOUT:-900}
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    AIRFLOW_POINT4_SCRIPTS_DIR: /opt/airflow/scripts
    AIRFLOW_POINT4_STATE_DIR: /opt/airflow/state
    ALLOW_SOURCE_UNAVAILABLE: ${ALLOW_SOURCE_UNAVAILABLE:-true}
    ALLOW_REINDEX_UNAVAILABLE: ${ALLOW_REINDEX_UNAVAILABLE:-true}
    FORCE_AIRFLOW_INIT: ${FORCE_AIRFLOW_INIT:-false}
    FORCE_REINDEX_PRODUCTS: ${FORCE_REINDEX_PRODUCTS:-false}
    REINDEX_ON_FIRST_RUN: ${REINDEX_ON_FIRST_RUN:-false}
    SEARCH_REINDEX_URL: ${SEARCH_REINDEX_URL:-http://search/reindex}
    SEARCH_AUTH_TOKEN: ${SEARCH_AUTH_TOKEN:-}
    SPARK_IMAGE: ${SPARK_IMAGE:-apache/spark:3.5.5-scala2.12-java17-python3-ubuntu}
    SPARK_MASTER_URL: spark://spark-master:7077
    SPARK_SCALE_FACTOR: ${SPARK_SCALE_FACTOR:-1000}
    SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-4}
  volumes:
    - ./dataW/airflow/dags:/opt/airflow/dags
    - ./dataW/airflow/scripts:/opt/airflow/scripts
    - ./dataW/airflow/logs:/opt/airflow/logs
    - ./dataW/airflow/plugins:/opt/airflow/plugins
    - ./dataW/airflow/state:/opt/airflow/state
    - /var/run/docker.sock:/var/run/docker.sock
  user: "0:0"
  networks:
    - restaurant-network

services:
  postgres:
    image: postgres:15.6
    container_name: restaurant-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_postgres_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dbs/postgres:/docker-entrypoint-initdb.d
    networks:
      - restaurant-network

#replica 1 de sharding
  cfg1:
    image: mongo:7.0
    container_name: restaurant-cfg1
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    volumes:
      - cfg1_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

#replica 2 de sharding
  cfg2:
    image: mongo:7.0
    container_name: restaurant-cfg2
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    volumes:
      - cfg2_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

#replica 3 de sharding
  cfg3:
    image: mongo:7.0
    container_name: restaurant-cfg3
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--port", "27019", "--bind_ip_all"]
    volumes:
      - cfg3_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

#shard 1, con replica set de 3 nodos (shard1a, shard1b, shard1c)
  shard1a:
    image: mongo:7.0
    container_name: restaurant-shard1a
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018", "--bind_ip_all"]
    volumes:
      - shard1a_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

#shard 1, con replica set de 3 nodos (shard1a, shard1b, shard1c)
  shard1b:
    image: mongo:7.0
    container_name: restaurant-shard1b
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018", "--bind_ip_all"]
    volumes:
      - shard1b_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

#shard 1, con replica set de 3 nodos (shard1a, shard1b, shard1c)
  shard1c:
    image: mongo:7.0
    container_name: restaurant-shard1c
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018", "--bind_ip_all"]
    volumes:
      - shard1c_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

  mongos:
    image: mongo:7.0
    container_name: restaurant-mongos
    command:
      [
        "mongos",
        "--port",
        "27017",
        "--bind_ip_all",
        "--configdb",
        "cfgReplSet/cfg1:27019,cfg2:27019,cfg3:27019"
      ]
    restart: unless-stopped
    ports:
      - "27017:27017"
    depends_on:
      mongo-config-setup:
        condition: service_completed_successfully
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/27017'"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 15s

# Inicializa cfgReplSet antes de levantar mongos (si no, mongos falla al arrancar).
  mongo-config-setup:
    image: mongo:7.0
    container_name: restaurant-mongo-config-setup
    depends_on:
      cfg1:
        condition: service_healthy
      cfg2:
        condition: service_healthy
      cfg3:
        condition: service_healthy
    volumes:
      - ./dbs/mongo:/scripts:ro
    command:
      - bash
      - -lc
      - |
        set -e
        echo "==> Initiating cfgReplSet..."
        mongosh --host cfg1 --port 27019 --quiet /scripts/init-configrs.js
        echo "==> cfgReplSet ready."
    networks:
      - restaurant-network
    restart: "no"

# Inicializa shard1ReplSet antes de hacer addShard (mongos/cluster).
  mongo-shard-setup:
    image: mongo:7.0
    container_name: restaurant-mongo-shard-setup
    depends_on:
      shard1a:
        condition: service_healthy
      shard1b:
        condition: service_healthy
      shard1c:
        condition: service_healthy
    volumes:
      - ./dbs/mongo:/scripts:ro
    command:
      - bash
      - -lc
      - |
        set -e
        echo "==> Initiating shard1ReplSet..."
        mongosh --host shard1a --port 27018 --quiet /scripts/init-shardrs.js
        echo "==> shard1ReplSet ready."
    networks:
      - restaurant-network
    restart: "no"

# se utiliza para quw todo este listo
  mongo-setup:
    image: mongo:7.0
    container_name: restaurant-mongo-setup
    depends_on:
      mongo-config-setup:
        condition: service_completed_successfully
      mongo-shard-setup:
        condition: service_completed_successfully
      mongos:
        condition: service_healthy
    volumes:
      - ./dbs/mongo:/scripts:ro
    command:
      - bash
      - -lc
      - |
        set -e

        echo "==> [1/3] Configuring sharded cluster (addShard, enableSharding)..."
        mongosh --host mongos --port 27017 --quiet /scripts/init-cluster.js

        echo "==> [2/3] Initializing schema..."
        mongosh --host mongos --port 27017 --quiet /scripts/init-mongo.js

        echo "==> [3/3] Sharding collections..."
        mongosh --host mongos --port 27017 --quiet /scripts/shard-collections.js

        echo "==> MongoDB setup complete."
    networks:
      - restaurant-network
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm 
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8001}:8080"
      #este es el json que se descarga de keycloak para tener persistencia de los datos
    volumes:
      - ./backend/app/restaurant-realm.json:/opt/keycloak/data/import/restaurant-realm.json
    networks:
      - restaurant-network


  #no me falta la configuracion de nginx??

  api:
    build:
      context: ./backend
      dockerfile: dockerfile
    expose:
      - "80"
    command: ["uvicorn", "backend.app.api_main:app", "--host", "0.0.0.0", "--port", "80", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *app-env
      SERVICE_NAME: api
      ROOT_PATH: /api
    depends_on:
      - postgres
      - mongos
      - mongo-setup
      - redis
      - elasticsearch
      - keycloak
    networks:
      - restaurant-network

  api_direct:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "${API_PORT:-8000}:80"
    command: ["uvicorn", "backend.app.api_main:app", "--host", "0.0.0.0", "--port", "80", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *app-env
      SERVICE_NAME: api_direct
      ROOT_PATH: ""
    depends_on:
      - postgres
      - mongos
      - mongo-setup
      - redis
      - elasticsearch
      - keycloak
    networks:
      - restaurant-network

  search:
    build:
      context: ./backend
      dockerfile: dockerfile
    expose:
      - "80"
    command: ["uvicorn", "backend.app.search_main:app", "--host", "0.0.0.0", "--port", "80", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *app-env
      SERVICE_NAME: search
      ROOT_PATH: /search
      SERVICE_MODE: api
    depends_on:
      - postgres
      - mongos
      - mongo-setup
      - redis
      - elasticsearch
      - keycloak
    networks:
      - restaurant-network

  nginx:
    image: nginx:1.27-alpine
    container_name: restaurant-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - search
    networks:
      - restaurant-network

  seed:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: restaurant-seed
    command: python backend/app/scripts/seed_admin.py
    environment:
      <<: *app-env
    depends_on:
      - postgres
      - mongos
      - mongo-setup
      - keycloak
    networks:
      - restaurant-network
    restart: "no"
  redis:
    image: redis:7.2
    container_name: restaurant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - restaurant-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: restaurant-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - restaurant-network

  # Spark master coordina el procesamiento distribuido del punto 2.
  spark-master:
    image: ${SPARK_IMAGE:-apache/spark:3.5.5-scala2.12-java17-python3-ubuntu}
    container_name: restaurant-spark-master
    volumes:
      - ./dataW/spark:/workspace/spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 0.0.0.0
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_WEB_PORT:-8081}:8080"
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/7077'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Spark worker ejecuta las tareas del job PySpark.
  spark-worker:
    image: ${SPARK_IMAGE:-apache/spark:3.5.5-scala2.12-java17-python3-ubuntu}
    container_name: restaurant-spark-worker
    volumes:
      - ./dataW/spark:/workspace/spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
    ports:
      - "${SPARK_WORKER_WEB_PORT:-8082}:8081"
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - restaurant-network

  # Job de analitica Spark: crea DataFrames, usa SparkSQL y guarda resultados.
  spark-analytics:
    image: ${SPARK_IMAGE:-apache/spark:3.5.5-scala2.12-java17-python3-ubuntu}
    container_name: restaurant-spark-analytics
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_SCALE_FACTOR: ${SPARK_SCALE_FACTOR:-1000}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-4}
    volumes:
      - ./dataW/spark:/workspace/spark
    command:
      - bash
      - -lc
      - |
        set -e
        /opt/spark/bin/spark-submit \
          --master "$$SPARK_MASTER_URL" \
          /workspace/spark/jobs/analytics_job.py
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
    networks:
      - restaurant-network
    restart: "no"

  hiveserver2:
    image: apache/hive:${HIVE_VERSION:-4.0.0}
    container_name: hiveserver2
    restart: unless-stopped
    user: "0:0"
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionURL=jdbc:derby:/opt/hive/metastore/metastore_db;create=true"
    ports:
      - "${HIVE_SERVER_PORT:-10000}:10000"
      - "${HIVE_WEB_PORT:-10002}:10002"
    volumes:
      - ./dataW/warehouse:/workspace/warehouse
      - hive_data:/opt/hive/data
      - hive_metastore:/opt/hive/metastore
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '</dev/tcp/localhost/10000'"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 300s

  warehouse-setup:
    image: apache/hive:${HIVE_VERSION:-4.0.0}
    container_name: restaurant-warehouse-setup
    environment:
      FORCE_WAREHOUSE_SETUP: ${FORCE_WAREHOUSE_SETUP:-false}
      RUN_WAREHOUSE_VALIDATION: ${RUN_WAREHOUSE_VALIDATION:-false}
    depends_on:
      hiveserver2:
        condition: service_healthy
    volumes:
      - ./dataW/warehouse:/workspace/warehouse
      - hive_data:/opt/hive/data
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e

        if [ "$(printenv FORCE_WAREHOUSE_SETUP)" != "true" ] && [ -f /opt/hive/data/.restaurant_warehouse_setup_complete ]; then
          if /opt/hive/bin/beeline -u "jdbc:hive2://hiveserver2:10000/default" --silent=true --showHeader=false -e "SHOW DATABASES LIKE 'restaurant_warehouse';" | grep -q restaurant_warehouse; then
            echo "==> Data Warehouse already initialized. Set FORCE_WAREHOUSE_SETUP=true to rebuild it."
            exit 0
          fi
          echo "==> Warehouse marker exists, but Hive metastore is missing restaurant_warehouse. Rebuilding it."
        fi

        echo "==> Creating warehouse database..."
        /opt/hive/bin/beeline -u "jdbc:hive2://hiveserver2:10000/default" -e "CREATE DATABASE IF NOT EXISTS restaurant_warehouse;"

        echo "==> Creating star schema..."
        /opt/hive/bin/beeline -u "jdbc:hive2://hiveserver2:10000/restaurant_warehouse" -f /workspace/warehouse/schemas/schema_star.sql

        echo "==> Loading warehouse seed data..."
        /opt/hive/bin/beeline -u "jdbc:hive2://hiveserver2:10000/restaurant_warehouse" -f /workspace/warehouse/tests/seed_warehouse.hql

        echo "==> Creating OLAP cubes/views..."
        /opt/hive/bin/beeline -u "jdbc:hive2://hiveserver2:10000/restaurant_warehouse" -f /workspace/warehouse/schemas/hive_olap_views.sql

        if [ "$(printenv RUN_WAREHOUSE_VALIDATION)" = "true" ]; then
          echo "==> Running warehouse validation queries..."
          /opt/hive/bin/beeline -u "jdbc:hive2://hiveserver2:10000/restaurant_warehouse" -f /workspace/warehouse/tests/validacion_requisitos_olap.hql
        else
          echo "==> Skipping warehouse validation queries. Set RUN_WAREHOUSE_VALIDATION=true to run them."
        fi

        touch /opt/hive/data/.restaurant_warehouse_setup_complete
        echo "==> Data Warehouse setup complete."
    networks:
      - restaurant-network
    restart: "no"

  # Inicializa la base interna de Superset y crea el usuario admin local.
  superset-init:
    build:
      context: ./dataW/visualization/superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-4.1.2}
    image: restaurant-superset:${SUPERSET_VERSION:-4.1.2}
    container_name: restaurant-superset-init
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-restaurant_superset_local_secret_change_me}
      FORCE_SUPERSET_INIT: ${FORCE_SUPERSET_INIT:-false}
      FORCE_SUPERSET_IMPORT: ${FORCE_SUPERSET_IMPORT:-false}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Admin}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Restaurant}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      HIVE_WAREHOUSE_SQLALCHEMY_URI: ${HIVE_WAREHOUSE_SQLALCHEMY_URI:-hive://hive@hiveserver2:10000/restaurant_warehouse?auth=NOSASL}
    volumes:
      - superset_home:/app/superset_home
      - ./dashboards.zip:/app/imports/dashboards.zip:ro
    command:
      - /bin/bash
      - -lc
      - |
        set -e

        if [ "$(printenv FORCE_SUPERSET_INIT)" != "true" ] && [ -f /app/superset_home/.superset_init_complete ]; then
          echo "==> Superset already initialized. Set FORCE_SUPERSET_INIT=true to rebuild it."
        else
          echo "==> Upgrading Superset metadata database..."
          superset db upgrade

          echo "==> Creating Superset admin user if needed..."
          superset fab create-admin \
            --username "$$SUPERSET_ADMIN_USERNAME" \
            --firstname "$$SUPERSET_ADMIN_FIRSTNAME" \
            --lastname "$$SUPERSET_ADMIN_LASTNAME" \
            --email "$$SUPERSET_ADMIN_EMAIL" \
            --password "$$SUPERSET_ADMIN_PASSWORD" || true

          echo "==> Initializing Superset roles and permissions..."
          superset init

          echo "==> Superset setup complete."
          touch /app/superset_home/.superset_init_complete
        fi

        echo "==> Registering Hive warehouse connection in Superset..."
        superset set-database-uri \
          -d "Restaurant Hive Warehouse" \
          -u "$$HIVE_WAREHOUSE_SQLALCHEMY_URI" || echo "[WARN] Could not auto-register Hive connection; create it manually from the Superset UI."

        if [ -f /app/imports/dashboards.zip ]; then
          if [ "$(printenv FORCE_SUPERSET_IMPORT)" = "true" ] || [ ! -f /app/superset_home/.superset_dashboards_import_complete ]; then
            echo "==> Importing Superset dashboards from dashboards.zip..."
            superset import-dashboards -p /app/imports/dashboards.zip -u "$$SUPERSET_ADMIN_USERNAME"
            touch /app/superset_home/.superset_dashboards_import_complete
          else
            echo "==> Superset dashboards already imported. Set FORCE_SUPERSET_IMPORT=true to re-import them."
          fi
        else
          echo "[WARN] /app/imports/dashboards.zip not found; skipping dashboard import."
        fi
    depends_on:
      hiveserver2:
        condition: service_healthy
      warehouse-setup:
        condition: service_completed_successfully
    networks:
      - restaurant-network
    restart: "no"

  # Herramienta BI del punto 3. Se conecta directamente a HiveServer2 y sus vistas OLAP.
  superset:
    image: restaurant-superset:${SUPERSET_VERSION:-4.1.2}
    container_name: restaurant-superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-restaurant_superset_local_secret_change_me}
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - superset_home:/app/superset_home
    command:
      - /bin/bash
      - -lc
      - |
        superset run -h 0.0.0.0 -p 8088
    depends_on:
      hiveserver2:
        condition: service_healthy
      warehouse-setup:
        condition: service_completed_successfully
      superset-init:
        condition: service_completed_successfully
    networks:
      - restaurant-network

  airflow-postgres:
    image: postgres:15.6
    container_name: restaurant-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: restaurant-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
      hiveserver2:
        condition: service_healthy
      warehouse-setup:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        export PATH="/home/airflow/.local/bin:$$PATH"

        if [ "$(printenv FORCE_AIRFLOW_INIT)" != "true" ] && [ -f /opt/airflow/state/.airflow_init_complete ]; then
          echo "==> Airflow already initialized. Set FORCE_AIRFLOW_INIT=true to rebuild it."
          exit 0
        fi

        echo "==> Migrating Airflow metadata database..."
        airflow db migrate

        echo "==> Creating Airflow admin user if needed..."
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USERNAME" \
          --firstname Admin \
          --lastname Restaurant \
          --role Admin \
          --email "$$AIRFLOW_ADMIN_EMAIL" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" || true

        echo "==> Checking DAG parsing..."
        airflow dags list | grep restaurant_olap_pipeline
        echo "==> Airflow init complete."
        touch /opt/airflow/state/.airflow_init_complete
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: restaurant-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"
    command: webserver --workers 1 --worker-timeout 900
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: restaurant-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://airflow-webserver:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

# Volumenes para persistir datos
volumes:
  postgres_data:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  mongo_data:
  redis_data:
  elasticsearch_data:
  hive_data:
  hive_metastore:
  superset_home:
  airflow_postgres_data:

# Define el tipo de red que usa la red, en este caso todos se pueden ver entre si
networks:
  restaurant-network:
    driver: bridge
